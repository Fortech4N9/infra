# --- Global ---
global:
  domain: code-analysis-project.ru
  imagePullPolicy: IfNotPresent
  namespace: diploma

# Только для наших сервисов (не для Bitnami subcharts)
platform:
  imageRegistry: cr.yandex/crpr1nbrl4jkl9erl1rd
  imagePullSecrets:
    - name: ycr-pull-secret
# Секрет создаётся вручную в кластере (см. DEPLOY.md). В Git — только имя.
secrets:
  existingSecret: diploma-platform-secrets
# Managed DB из Terraform (подставьте после terraform output)
external:
  postgres:
    host: rc1a-7u696s7hkc14tl0q.mdb.yandexcloud.net
    port: 6432
    user: diplom
    coreDb: core_db
    analysisDb: analysis_db
  redis:
    host: rc1a-uaoh7tt2auqanlnd.mdb.yandexcloud.net
    port: 6379
  clickhouse:
    host: rc1a-pqhqh70oq1v9h41p.mdb.yandexcloud.net
    httpPort: 8123
    nativePort: 9000
    user: diplom_ch
    database: analysis_metrics
# --- Ingress (NGINX Ingress Controller должен быть установлен отдельно) ---
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/acme-http01-edit-in-place: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  tls:
    enabled: true
    secretName: diploma-platform-tls
# --- Образы (теги обновляет GitHub Actions через yq) ---
coreApi:
  enabled: true
  image:
    repository: core-api
    tag: a5ae368c6808403c05d0e2de0a2202296900da25
  replicaCount: 1
  port: 8081
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
analysisApi:
  enabled: true
  image:
    repository: analysis-api
    tag: a77dfc12a24790c660c51f550f2c708f8cc713a7
  replicaCount: 1
  port: 8082
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
frontend:
  enabled: true
  image:
    repository: frontend
    tag: 0406cc6def27c031b9a202dbc37ed6b2ae6829d5
  replicaCount: 1
  port: 80
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}
workerStatic:
  enabled: true
  image:
    repository: worker-static
    tag: 2cde0e24d539828980e2ef51b9ef61f1c5c6ca3a
  replicaCount: 1
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  nodeSelector:
    kubernetes.io/arch: amd64
workerCache:
  enabled: true
  image:
    repository: worker-cache
    tag: 78d960b4a2e06d7bf9c016e235f0d4d815e84e5f
  replicaCount: 1
  interpreterBinary: /usr/local/bin/cats
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  nodeSelector:
    kubernetes.io/arch: amd64
# --- Init hooks ---
initJobs:
  clickhouse:
    enabled: true
  minio:
    enabled: true
  postgres:
    enabled: true
# --- Subchart: Kafka (in-cluster) ---
kafka:
  enabled: true
  fullnameOverride: kafka
  global:
    imageRegistry: ""
    imagePullSecrets: []
  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
  kraft:
    enabled: true
  zookeeper:
    enabled: false
  controller:
    replicaCount: 1
  broker:
    replicaCount: 0
  listeners:
    client:
      protocol: PLAINTEXT
  extraConfig: |
    auto.create.topics.enable=true
  persistence:
    enabled: true
    size: 8Gi
# --- Subchart: MinIO (in-cluster) ---
minio:
  enabled: true
  fullnameOverride: minio
  global:
    imageRegistry: ""
    imagePullSecrets: []
  image:
    registry: docker.io
    repository: bitnamilegacy/minio
  mode: standalone
  auth:
    existingSecret: diploma-platform-secrets
    rootUserSecretKey: MINIO_ROOT_USER
    rootPasswordSecretKey: MINIO_ROOT_PASSWORD
  persistence:
    enabled: true
    size: 20Gi
  defaultBuckets: ""
