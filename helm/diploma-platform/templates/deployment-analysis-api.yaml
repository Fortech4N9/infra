{{- if .Values.analysisApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis-api
  labels:
    app.kubernetes.io/name: analysis-api
spec:
  replicas: {{ .Values.analysisApi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: analysis-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analysis-api
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- include "diploma-platform.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: analysis-api
          image: {{ include "diploma-platform.image" (dict "Values" .Values "repository" .Values.analysisApi.image.repository "tag" .Values.analysisApi.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.analysisApi.port }}
          env:
            - name: DB_HOST
              value: {{ .Values.external.postgres.host | quote }}
            - name: DB_PORT
              value: {{ .Values.external.postgres.port | quote }}
            - name: DB_USER
              value: {{ .Values.external.postgres.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              value: {{ .Values.external.postgres.analysisDb | quote }}
            - name: REDIS_ADDR
              value: {{ printf "%s:%v" .Values.external.redis.host .Values.external.redis.port | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: JWT_SECRET
            - name: MINIO_ENDPOINT
              value: {{ include "diploma-platform.minioEndpoint" . | quote }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_USE_SSL
              value: "false"
            - name: KAFKA_BROKERS
              value: {{ include "diploma-platform.kafkaBrokers" . | quote }}
            - name: CLICKHOUSE_ADDR
              value: {{ printf "%s:%v" .Values.external.clickhouse.host .Values.external.clickhouse.nativePort | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.external.clickhouse.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_DB
              value: {{ .Values.external.clickhouse.database | quote }}
            - name: SERVER_PORT
              value: {{ .Values.analysisApi.port | quote }}
          resources:
            {{- toYaml .Values.analysisApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: analysis-api
spec:
  selector:
    app.kubernetes.io/name: analysis-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.analysisApi.port }}
      targetPort: {{ .Values.analysisApi.port }}
{{- end }}
