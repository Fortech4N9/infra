{{- if .Values.workerCache.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-cache
spec:
  replicas: {{ .Values.workerCache.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-cache
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-cache
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- include "diploma-platform.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.workerCache.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker-cache
          image: {{ include "diploma-platform.image" (dict "Values" .Values "repository" .Values.workerCache.image.repository "tag" .Values.workerCache.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: INTERPRETER_BINARY
              value: {{ .Values.workerCache.interpreterBinary | quote }}
            - name: KAFKA_BROKERS
              value: {{ include "diploma-platform.kafkaBrokers" . | quote }}
            - name: MINIO_ENDPOINT
              value: {{ include "diploma-platform.minioEndpoint" . | quote }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_USE_SSL
              value: "false"
            - name: CLICKHOUSE_ADDR
              value: {{ printf "%s:%v" .Values.external.clickhouse.host .Values.external.clickhouse.nativePort | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.external.clickhouse.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_DB
              value: {{ .Values.external.clickhouse.database | quote }}
          resources:
            {{- toYaml .Values.workerCache.resources | nindent 12 }}
{{- end }}
