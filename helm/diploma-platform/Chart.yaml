apiVersion: v2
name: diploma-platform
description: Event-driven cache-analysis platform (APIs, workers, Kafka, MinIO)
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: kafka
    version: 29.3.14
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
  - name: minio
    version: 14.8.5
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
