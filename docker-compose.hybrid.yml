name: cache-analysis-hybrid

services:
  postgres:
    image: postgres:16-alpine
    container_name: cache-analysis-hybrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CORE_DB_NAME: ${CORE_DB_NAME}
      ANALYSIS_DB_NAME: ${ANALYSIS_DB_NAME}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data_hybrid:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql
      - ./postgres/02-core-schema.sql:/docker-entrypoint-initdb.d/02-core-schema.sql
      - ./postgres/03-analysis-schema.sql:/docker-entrypoint-initdb.d/03-analysis-schema.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"${POSTGRES_USER}\" && PGPASSWORD=\"${POSTGRES_PASSWORD}\" psql -h 127.0.0.1 -U \"${POSTGRES_USER}\" -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='${ANALYSIS_DB_NAME}'\" | grep -q 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - cache-analysis-hybrid-net

  postgres-init:
    image: postgres:16-alpine
    container_name: cache-analysis-hybrid-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      CORE_DB_NAME: ${CORE_DB_NAME}
      ANALYSIS_DB_NAME: ${ANALYSIS_DB_NAME}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        psql -h postgres -U "$$POSTGRES_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$ANALYSIS_DB_NAME'" | grep -q 1 \
          || psql -h postgres -U "$$POSTGRES_USER" -d postgres -c "CREATE DATABASE $$ANALYSIS_DB_NAME"
        echo "[postgres-init] analysis database ready"
    restart: "no"
    networks:
      - cache-analysis-hybrid-net

  minio:
    image: minio/minio:latest
    container_name: cache-analysis-hybrid-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data_hybrid:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - cache-analysis-hybrid-net

  minio-init:
    image: minio/mc:latest
    container_name: cache-analysis-hybrid-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    volumes:
      - ./minio/init-buckets.sh:/init-buckets.sh
    restart: "no"
    networks:
      - cache-analysis-hybrid-net

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: cache-analysis-hybrid-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    ports:
      - "${CLICKHOUSE_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_PORT}:9000"
    volumes:
      - clickhouse_data_hybrid:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - cache-analysis-hybrid-net

  clickhouse-init:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: cache-analysis-hybrid-clickhouse-init
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        clickhouse-client --host clickhouse --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" \
          --queries-file /init.sql
        echo "[clickhouse-init] schema ready"
    volumes:
      - ./clickhouse/init.sql:/init.sql
    restart: "no"
    networks:
      - cache-analysis-hybrid-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: cache-analysis-hybrid-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data_hybrid:/var/lib/zookeeper/data
      - zookeeper_log_hybrid:/var/lib/zookeeper/log
    networks:
      - cache-analysis-hybrid-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: cache-analysis-hybrid-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_BROKER_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_BROKER_PORT}:9092"
    volumes:
      - kafka_data_hybrid:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks:
      - cache-analysis-hybrid-net

  analysis-api:
    build:
      context: ../analysis-api
      dockerfile: Dockerfile
    container_name: cache-analysis-hybrid-analysis-api
    restart: unless-stopped
    ports:
      - "${ANALYSIS_API_PORT}:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${ANALYSIS_DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      DEV_USER_ID: ${DEV_USER_ID:-00000000-0000-0000-0000-000000000001}
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-dev@analysis.local}
      DEV_USER_ROLE: ${DEV_USER_ROLE:-admin}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "false"
      KAFKA_BROKERS: kafka:29092
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      SERVER_PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
    networks:
      - cache-analysis-hybrid-net

  worker-static:
    build:
      context: ../static-analysis-worker
      dockerfile: Dockerfile
    image: static-analysis-worker:hybrid
    container_name: cache-analysis-hybrid-worker-static
    platform: linux/amd64
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:29092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "false"
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
    networks:
      - cache-analysis-hybrid-net

  worker-cache:
    build:
      context: ../cache-analysis-worker
      dockerfile: Dockerfile
    image: cache-analysis-worker:hybrid
    container_name: cache-analysis-hybrid-worker-cache
    platform: linux/amd64
    restart: unless-stopped
    environment:
      INTERPRETER_BINARY: /usr/local/bin/cats
      KAFKA_BROKERS: kafka:29092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "false"
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - cache-analysis-hybrid-net

volumes:
  postgres_data_hybrid:
  minio_data_hybrid:
  clickhouse_data_hybrid:
  zookeeper_data_hybrid:
  zookeeper_log_hybrid:
  kafka_data_hybrid:

networks:
  cache-analysis-hybrid-net:
    driver: bridge
