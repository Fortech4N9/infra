# Пример для External Secrets Operator (опционально).
# Секреты храните в Yandex Lockbox / Vault, не в Git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: diploma-platform-secrets
  namespace: diploma
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: yandex-lockbox
    kind: ClusterSecretStore
  target:
    name: diploma-platform-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: diploma-platform
        property: jwt_secret
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: diploma-platform
        property: postgres_password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: diploma-platform
        property: redis_password
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: diploma-platform
        property: clickhouse_password
    - secretKey: MINIO_ROOT_USER
      remoteRef:
        key: diploma-platform
        property: minio_root_user
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: diploma-platform
        property: minio_root_password
