# Override-файл для запуска внутри Lima x86_64 VM. Подключается в `make lima-stack`.
# Базовый docker-compose.yml остаётся чистым; всё, что нужно для x86_64 VM
# на Apple Silicon и для ClickHouse под VM-ядром, живёт здесь.
services:
  # Под Lima x86_64-VM на Apple Silicon работает QEMU full-system эмуляция,
  # на ней свежий 24.10-alpine падает с двумя проблемами:
  #   1) "get_mempolicy: Operation not permitted" — дефолтный seccomp режет
  #      NUMA-syscalls.
  #   2) "Calculated checksum of the executable does not correspond to the
  #      reference checksum" (exit 246) — self-checksum бинаря не сходится
  #      под эмуляцией.
  # Решение: берём LTS 24.3 ubuntu-based (его binary checksum под QEMU стабилен)
  # и снимаем seccomp + даём CH рекомендованные капабилити/лимиты.
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    cap_add:
      - SYS_NICE
      - IPC_LOCK
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  clickhouse-init:
    image: clickhouse/clickhouse-server:24.3

  # Дефолтный Docker seccomp-profile режет часть syscalls, которые
  # использует wine (socket-семейство, ptrace и т.п.).
  worker-static:
    security_opt:
      - seccomp:unconfined

  # Оставляем тот же override для cache-воркера: он безвреден для текущего
  # native cats-бинаря и сохраняет совместимость с wine-based сборками.
  worker-cache:
    security_opt:
      - seccomp:unconfined
